[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vessel-tracker"
version = "0.1.0"
description = "Python toolkit for tracking live vessel (AIS/MarineTraffic) and aircraft (ADS-B/FlightRadar24) positions."
readme = "README.md"
license = { file = "License.txt" }
authors = [{ name = "George Vassos" }]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.3",
    "psycopg[binary]>=3.3.4",
    "curl-cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "polyfactory>=2.16.0",
    "ruff>=0.3.0",
]
app = [
    "streamlit>=1.35",
    "pydeck>=0.9",
]

[project.scripts]
vessel-tracker   = "tracker.marine.runner:main"
aviation-tracker = "tracker.aviation.runner:main"
aviation-sweep   = "tracker.aviation.sweep:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_file = "tests/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true

