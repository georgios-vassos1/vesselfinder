services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vessel_track
      POSTGRES_USER: vessel
      POSTGRES_PASSWORD: vessel
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel -d vessel_track"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  scraper:
    build: .
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vessel:vessel@timescaledb:5432/vessel_track
      SCRAPE_INTERVAL_MINUTES: "10"
      SCRAPE_OS: Linux
    volumes:
      - ./data:/app/data

volumes:
  timescaledb_data:
